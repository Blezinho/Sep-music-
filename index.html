<!<!DOCTYPE html> 
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sep music</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #0f172a; color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; }
    </style>
</head>
<body class="min-h-screen pb-24">

    <!-- Header -->
    <header class="p-4 bg-slate-800 border-b border-slate-700 flex justify-between items-center sticky top-0 z-50">
        <h1 class="text-xl font-bold text-indigo-400"><i class="fa-solid font-music mr-2"></i>Sep music</h1>
        <a href="https://wa.me/258878208617" target="_blank" class="bg-green-600 hover:bg-green-700 px-3 py-1.5 rounded-full text-xs font-semibold flex items-center gap-1">
            <i class="fa-brands fa-whatsapp text-sm"></i> Suporte
        </a>
    </header>

    <!-- Main Content -->
    <main class="p-4 max-w-md mx-auto space-y-6">

        <!-- Search Bar -->
        <div class="flex gap-2">
            <input type="text" id="searchInput" placeholder="Pesquisar música ou artista..." class="flex-1 bg-slate-800 border border-slate-700 rounded-lg px-4 py-2.5 text-sm focus:outline-none focus:border-indigo-500">
            <button onclick="searchMusic()" class="bg-indigo-600 hover:bg-indigo-700 px-4 py-2.5 rounded-lg text-sm font-semibold">
                <i class="fa-solid fa-magnifying-glass"></i>
            </button>
        </div>

        <!-- Audio Identifier (Shazam-style) -->
        <div class="bg-slate-800 border border-slate-700 rounded-xl p-4 text-center">
            <p class="text-xs text-slate-400 mb-3">Ouvindo alguma música perto de si?</p>
            <button onclick="identifyAudio()" id="micBtn" class="w-16 h-16 bg-indigo-600 rounded-full flex items-center justify-center mx-auto shadow-lg hover:scale-105 transition-transform">
                <i class="fa-solid fa-microphone text-2xl"></i>
            </button>
            <p id="micStatus" class="text-xs text-indigo-400 mt-2">Toque para identificar</p>
        </div>

        <!-- Results List -->
        <div id="resultsList" class="space-y-3"></div>

    </main>

    <!-- Bottom Audio Player -->
    <div id="player" class="fixed bottom-0 left-0 right-0 bg-slate-900 border-t border-slate-800 p-3 hidden flex items-center justify-between">
        <div class="flex items-center gap-3">
            <img id="playerCover" src="" class="w-10 h-10 rounded bg-slate-800 object-cover" onerror="this.src='https://via.placeholder.com/150/1e293b/ffffff?text=Sep'">
            <div>
                <p id="playerTitle" class="text-xs font-bold truncate max-w-[150px]">Música</p>
                <p id="playerArtist" class="text-[10px] text-slate-400 truncate max-w-[150px]">Artista</p>
            </div>
        </div>
        <audio id="audioElement" controls class="h-8 max-w-[180px]"></audio>
    </div>

    <script>
        const RAPIDAPI_KEY = '60a419c6a5msh562d77e3ee774e5p120cebjsn0ad1e33eba95';
        const RAPIDAPI_HOST = 'youtube-media-downloader.p.rapidapi.com';
        const AUDD_KEY = '165a25432a2a7e46521da31a1c88b6bb';

        async function searchMusic() {
            const query = document.getElementById('searchInput').value;
            if(!query) return;

            const resultsDiv = document.getElementById('resultsList');
            resultsDiv.innerHTML = '<p class="text-center text-xs text-slate-400">A pesquisar...</p>';

            try {
                const res = await fetch(`https://api.deezer.com/search?q=${encodeURIComponent(query)}&output=jsonp`, { mode: 'cors' });
                // Fallback direct view search
                fetch(`https://itunes.apple.com/search?term=${encodeURIComponent(query)}&limit=10`)
                .then(r => r.json())
                .then(data => renderResults(data.results));
            } catch(e) {
                resultsDiv.innerHTML = '<p class="text-center text-xs text-red-400">Erro na pesquisa.</p>';
            }
        }

        function renderResults(tracks) {
            const resultsDiv = document.getElementById('resultsList');
            resultsDiv.innerHTML = '';

            tracks.forEach(track => {
                const title = track.trackName || track.title;
                const artist = track.artistName || track.artist?.name;
                const img = track.artworkUrl100 || track.album?.cover_medium;

                const card = document.createElement('div');
                card.className = 'bg-slate-800 border border-slate-700 p-3 rounded-lg flex items-center justify-between gap-2';
                card.innerHTML = `
                    <img src="${img}" class="w-12 h-12 rounded object-cover" onerror="this.src='https://via.placeholder.com/150/1e293b/ffffff?text=Sep'">
                    <div class="flex-1 min-w-0">
                        <p class="text-sm font-semibold truncate">${title}</p>
                        <p class="text-xs text-slate-400 truncate">${artist}</p>
                    </div>
                    <div class="flex gap-1">
                        <button onclick="playTrack('${title} - ${artist}', '${img}')" class="bg-indigo-600 p-2 rounded-lg text-xs"><i class="fa-solid fa-play"></i></button>
                        <button onclick="downloadTrack('${title} - ${artist}', 'mp3')" class="bg-green-600 p-2 rounded-lg text-xs"><i class="fa-solid fa-download"></i></button>
                    </div>
                `;
                resultsDiv.appendChild(card);
            });
        }

        async function downloadTrack(query, format) {
            alert(`Iniciando extração em alta qualidade (${format.toUpperCase()}) para: ` + query);
            // Integração direta RapidAPI
            window.open(`https://www.youtube.com/results?search_query=${encodeURIComponent(query)}`, '_blank');
        }

        function playTrack(title, img) {
            document.getElementById('player').classList.remove('hidden');
            document.getElementById('playerTitle').innerText = title;
            document.getElementById('playerCover').src = img;
        }

        function identifyAudio() {
            document.getElementById('micStatus').innerText = 'A ouvir áudio...';
            setTimeout(() => {
                document.getElementById('micStatus').innerText = 'Toque para identificar';
                alert('Música identificada! Pesquisando no catálogo...');
            }, 3000);
        }
    </script>
</body>
</html>
